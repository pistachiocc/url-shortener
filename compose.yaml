services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: shortener
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata: